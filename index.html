<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA 動態看板</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", Arial, sans-serif; }
    .table th { background-color: #198754 !important; color: white; white-space: nowrap; }
    .score-detail { white-space: pre-line; font-size: 0.85rem; color: #333; }
    
    /* 響應式切換：手機版顯示卡片，電腦版顯示表格 */
    @media (max-width: 768px) {
      .desktop-table-view { display: none !important; }
      .mobile-card-view { display: block !important; }
    }
    .mobile-card-view { display: none; }
  </style>
</head>
<body class="py-3">

  <div class="container-fluid px-3">
    <div class="row align-items-center mb-3 g-2">
      <div class="col-12 col-md-6">
        <h2 class="fw-bold mb-0">🏀 NBA 動態看板</h2>
      </div>
      <div class="col-12 col-md-6 text-md-end">
        <div class="d-flex align-items-center justify-content-md-end">
          <label for="teamSelect" class="form-label fw-bold me-2 mb-0 text-nowrap">選擇球隊：</label>
          <select id="teamSelect" class="form-select w-auto shadow-sm" onchange="onTeamChange()">
            <option value="">載入球隊中...</option>
          </select>
        </div>
      </div>
    </div>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-success" role="status"></div>
      <p class="mt-2 text-muted">正在向雲端同步資料...</p>
    </div>

    <div id="content" style="display:none;">
      <!-- 電腦版表格 -->
      <div class="desktop-table-view table-responsive shadow-sm rounded bg-white border">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>比賽日期</th>
              <th>對手</th>
              <th>主/客</th>
              <th>比分明細</th>
              <th>Q1讓分盤口</th>
              <th>上半讓分盤口</th>
              <th>全場讓分盤口</th>
              <th class="text-center">Q1過盤</th>
              <th class="text-center">上半過盤</th>
              <th class="text-center">全場過盤</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- 手機版卡片 -->
      <div class="mobile-card-view" id="mobileCardContainer"></div>
    </div>
  </div>

  <script>
    // 🔴 請確保這裡填入的是你最新部署的 GAS 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzD_odp2rbPbC25cVyneyseMRv401b_3NspupXhhK59qtYhgNtPyyu1f2Q0txWnzGNc/execc";

    let globalLogs = [];

    window.onload = function() {
      fetch(GAS_API_URL)
        .then(response => response.json())
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('content').style.display = 'block';

          globalLogs = data.logs;
          const select = document.getElementById('teamSelect');
          select.innerHTML = '';

          data.teams.forEach(team => {
            let opt = document.createElement('option');
            opt.value = team;
            opt.textContent = team;
            select.appendChild(opt);
          });

          if(data.teams.length > 0) onTeamChange();
        })
        .catch(err => {
          document.getElementById('loading').innerHTML = '<div class="alert alert-danger">載入失敗: ' + err + '</div>';
        });
    };

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      if (dateStr.includes('T')) {
        return dateStr.split('T')[0];
      }
      return dateStr;
    }

    function onTeamChange() {
      const selectedTeam = document.getElementById('teamSelect').value;
      const teamLogs = globalLogs.filter(item => item.team === selectedTeam);
      
      const tbody = document.getElementById('tableBody');
      const mobileContainer = document.getElementById('mobileCardContainer');
      
      tbody.innerHTML = '';
      mobileContainer.innerHTML = '';

      if (teamLogs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-3">查無賽事資料</td></tr>';
        mobileContainer.innerHTML = '<div class="text-center text-muted py-3 bg-white rounded shadow-sm">查無賽事資料</div>';
        return;
      }

      teamLogs.forEach(log => {
        // 電腦版表格行
        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="text-nowrap">${formatDate(log.date)}</td>
          <td class="fw-bold text-nowrap">${log.opponent || '-'}</td>
          <td><span class="badge ${log.homeAway === '主' ? 'bg-success' : 'bg-secondary'}">${log.homeAway || '-'}</span></td>
          <td class="score-detail">${log.scoreDetail || '-'}</td>
          <td>${log.q1Spd !== undefined && log.q1Spd !== '' ? log.q1Spd : '-'}</td>
          <td>${log.halfSpd !== undefined && log.halfSpd !== '' ? log.halfSpd : '-'}</td>
          <td>${log.fullSpd !== undefined && log.fullSpd !== '' ? log.fullSpd : '-'}</td>
          <td class="text-center">${log.q1Res || '-'}</td>
          <td class="text-center">${log.halfRes || '-'}</td>
          <td class="text-center">${log.fullRes || '-'}</td>
        `;
        tbody.appendChild(tr);

        // 手機版卡片
        let card = document.createElement('div');
        card.className = 'card mb-3 shadow-sm border-0';
        card.innerHTML = `
          <div class="card-header bg-white d-flex justify-content-between align-items-center py-2">
            <span class="fw-bold text-success">${formatDate(log.date)}</span>
            <span class="badge ${log.homeAway === '主' ? 'bg-success' : 'bg-secondary'}">${log.homeAway} vs ${log.opponent || '-'}</span>
          </div>
          <div class="card-body py-2">
            <div class="mb-2 bg-light p-2 rounded score-detail">${log.scoreDetail || '-'}</div>
            <div class="row text-center small g-1 mb-2">
              <div class="col-4 border-end">
                <div class="text-muted">Q1 盤/果</div>
                <div>${log.q1Spd || '-'} / <span class="fw-bold">${log.q1Res || '-'}</span></div>
              </div>
              <div class="col-4 border-end">
                <div class="text-muted">半場 盤/果</div>
                <div>${log.halfSpd || '-'} / <span class="fw-bold">${log.halfRes || '-'}</span></div>
              </div>
              <div class="col-4">
                <div class="text-muted">全場 盤/果</div>
                <div>${log.fullSpd || '-'} / <span class="fw-bold">${log.fullRes || '-'}</span></div>
              </div>
            </div>
          </div>
        `;
        mobileContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
